name: Seed cliente de teste para suporte (temporario)
on: workflow_dispatch
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependencias
        run: pip install psycopg2-binary werkzeug
      - name: Seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          python3 << 'PYEOF'
          import os, psycopg2
          from werkzeug.security import generate_password_hash
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("SELECT id FROM companies WHERE nome=%s", ("Suporte Teste Temp",))
          row = cur.fetchone()
          print("company row:", row)
          company_id = row[0]

          senha_hash = generate_password_hash("SenhaCliente123!")
          cur.execute(
              "INSERT INTO clientes (nome, email, telefone, cpf, company_id, senha) "
              "VALUES (%s, %s, %s, %s, %s, %s) RETURNING id",
              ("Cliente Suporte Teste", "cliente.suporte.teste@aluguelfacil.com", "21999998888", "11122233344", company_id, senha_hash),
          )
          cliente_id = cur.fetchone()[0]
          conn.commit()
          print("cliente_id criado:", cliente_id, "company_id:", company_id)
          cur.close()
          conn.close()
          PYEOF
