name: Diagnostico final varredura teste (temporario)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar psycopg2
        run: pip install psycopg2-binary --break-system-packages || pip install psycopg2-binary
      - name: Rodar diagnostico
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          python3 << 'PYEOF'
          import psycopg2, psycopg2.extras, os
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor)

          cur.execute("SELECT id, nome, slug FROM companies ORDER BY id")
          print("=== TODAS AS COMPANIES ===")
          for c in cur.fetchall():
              print(dict(c))

          cur.execute("SELECT id, username, email, company_id FROM usuarios WHERE username LIKE 'teste%' ORDER BY id")
          print("\n=== USUARIOS 'teste%' remanescentes ===")
          for u in cur.fetchall():
              print(dict(u))

          cur.execute("SELECT COUNT(*) AS total FROM equipment_items")
          print("\nequipment_items total:", cur.fetchone())

          cur.execute("SELECT COUNT(*) AS total FROM signup_attempts")
          print("signup_attempts total:", cur.fetchone())

          cur.close()
          conn.close()
          PYEOF
