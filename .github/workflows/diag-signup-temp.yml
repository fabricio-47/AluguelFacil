name: Diagnostico signup teste v2 (temporario)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar psycopg2
        run: pip install psycopg2-binary --break-system-packages || pip install psycopg2-binary
      - name: Rodar diagnostico
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          python3 << 'PYEOF'
          import psycopg2, psycopg2.extras, os
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor)
          cur.execute("""
              SELECT id, username, email, company_id
              FROM usuarios
              WHERE username LIKE 'teste_trial_auto%'
              ORDER BY id
          """)
          usuarios = cur.fetchall()
          print("=== USUARIOS DE TESTE ===")
          for u in usuarios:
              print(dict(u))

          company_ids = [u["company_id"] for u in usuarios]
          print("\n=== COMPANIES ===")
          if company_ids:
              cur.execute("SELECT id, nome, slug FROM companies WHERE id = ANY(%s)", (company_ids,))
              for c in cur.fetchall():
                  print(dict(c))

          print("\n=== BRANCHES ===")
          if company_ids:
              cur.execute("SELECT id, company_id, nome FROM branches WHERE company_id = ANY(%s)", (company_ids,))
              for b in cur.fetchall():
                  print(dict(b))

          print("\n=== COMPANY_MODULOS (deveria ter 11 linhas, todas trial) ===")
          if company_ids:
              cur.execute("SELECT company_id, modulo, status, trial_termina_em FROM company_modulos WHERE company_id = ANY(%s) ORDER BY company_id, modulo", (company_ids,))
              rows = cur.fetchall()
              print("total:", len(rows))
              for m in rows:
                  print(dict(m))

          print("\n=== SIGNUP_ATTEMPTS (contagem total) ===")
          cur.execute("SELECT COUNT(*) AS total FROM signup_attempts")
          print(cur.fetchone())

          cur.close()
          conn.close()
          PYEOF
