name: Limpeza teste bundling (temporario)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar psycopg2
        run: pip install psycopg2-binary --break-system-packages || pip install psycopg2-binary
      - name: Rodar limpeza
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          python3 << 'PYEOF'
          import psycopg2, os
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()

          cur.execute("SELECT id FROM usuarios WHERE username = 'teste_bundling'")
          row = cur.fetchone()
          user_id = row[0] if row else None

          cur.execute("SELECT id FROM companies WHERE nome = 'Empresa Teste Bundling'")
          row = cur.fetchone()
          company_id = row[0] if row else None

          print("user_id:", user_id, "company_id:", company_id)

          if user_id:
              cur.execute("DELETE FROM usuarios WHERE id = %s", (user_id,))
              print("usuarios deletados:", cur.rowcount)

          if company_id:
              cur.execute("DELETE FROM branches WHERE company_id = %s", (company_id,))
              print("branches deletados:", cur.rowcount)
              cur.execute("DELETE FROM company_modulos WHERE company_id = %s", (company_id,))
              print("company_modulos deletados:", cur.rowcount)
              cur.execute("DELETE FROM companies WHERE id = %s", (company_id,))
              print("companies deletados:", cur.rowcount)

          cur.execute("DELETE FROM signup_attempts")
          print("signup_attempts limpos:", cur.rowcount)

          conn.commit()
          cur.close()
          conn.close()
          print("OK - limpeza concluida")
          PYEOF
