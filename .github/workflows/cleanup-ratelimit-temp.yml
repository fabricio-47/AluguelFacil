name: Limpeza teste rate limit (temporario)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar psycopg2
        run: pip install psycopg2-binary --break-system-packages || pip install psycopg2-binary
      - name: Rodar limpeza
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          python3 << 'PYEOF'
          import psycopg2, os
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()

          cur.execute("SELECT id, company_id FROM usuarios WHERE username LIKE 'teste_rl_%'")
          rows = cur.fetchall()
          print("usuarios encontrados:", rows)
          user_ids = [r[0] for r in rows]
          company_ids = [r[1] for r in rows]

          if user_ids:
              cur.execute("DELETE FROM usuarios WHERE id = ANY(%s)", (user_ids,))
              print("usuarios deletados:", cur.rowcount)

          if company_ids:
              cur.execute("DELETE FROM branches WHERE company_id = ANY(%s)", (company_ids,))
              print("branches deletados:", cur.rowcount)
              cur.execute("DELETE FROM company_modulos WHERE company_id = ANY(%s)", (company_ids,))
              print("company_modulos deletados:", cur.rowcount)
              cur.execute("DELETE FROM companies WHERE id = ANY(%s)", (company_ids,))
              print("companies deletados:", cur.rowcount)

          cur.execute("DELETE FROM signup_attempts")
          print("signup_attempts limpos:", cur.rowcount)

          conn.commit()
          cur.close()
          conn.close()
          print("OK - limpeza concluida")
          PYEOF
