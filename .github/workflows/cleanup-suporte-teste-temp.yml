name: Limpar dados de teste do suporte (temporario)
on: workflow_dispatch
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar psycopg2
        run: pip install psycopg2-binary
      - name: Rodar limpeza
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          python3 << 'PYEOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("SELECT id FROM companies WHERE nome=%s", ("Suporte Teste Temp",))
          row = cur.fetchone()
          print("empresa encontrada:", row)
          if row:
              cid = row[0]
              cur.execute("""
                  DELETE FROM suporte_mensagens WHERE ticket_id IN (
                      SELECT id FROM suporte_tickets WHERE company_id=%s
                  )
              """, (cid,))
              cur.execute("DELETE FROM suporte_tickets WHERE company_id=%s", (cid,))
              cur.execute("DELETE FROM clientes WHERE company_id=%s", (cid,))
              cur.execute("DELETE FROM branches WHERE company_id=%s", (cid,))
              cur.execute("DELETE FROM company_modulos WHERE company_id=%s", (cid,))
              cur.execute("DELETE FROM usuarios WHERE company_id=%s", (cid,))
              cur.execute("DELETE FROM companies WHERE id=%s", (cid,))
          conn.commit()
          print("limpeza concluida")
          cur.close()
          conn.close()
          PYEOF
