name: Rodar migracao 021 (temporario)

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias minimas
        run: pip install psycopg2-binary
      - name: Rodar migracao 021 --apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: python migrate_remove_dead_tables.py --apply
