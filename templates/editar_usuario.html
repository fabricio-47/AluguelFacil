{% extends "base.html" %}
{% block title %}Editar Usuário{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Editar Usuário: {{ usuario.username }}</h2>
  <a href="{{ url_for('usuarios.listar_usuarios') }}" class="btn btn-outline-secondary">
    <i class="fa-solid fa-arrow-left me-1"></i> Usuários
  </a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" action="{{ url_for('usuarios.editar_usuario', id=usuario.id) }}">
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" value="{{ usuario.email }}" disabled>
      </div>
      <div class="mb-3">
        <label class="form-label">Cargo</label>
        <select name="role" class="form-select" required>
          {% for r in roles %}
          <option value="{{ r }}" {% if r == usuario.role %}selected{% endif %}>{{ r }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
  </div>
</div>

<div class="card mt-3">
  <div class="card-body">
    <h5 class="card-title">Senha</h5>
    <p class="card-text text-muted">Gera uma senha temporária aleatória para o usuário. A senha atual dele deixa de funcionar imediatamente.</p>
    <form method="post" action="{{ url_for('usuarios.resetar_senha_usuario', id=usuario.id) }}">
      <button type="submit" class="btn btn-outline-danger">
        <i class="fa-solid fa-key me-1"></i> Gerar nova senha temporária
      </button>
    </form>
  </div>
</div>
{% endblock %}
