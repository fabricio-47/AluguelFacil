{% extends "base.html" %}
{% block title %}Editar Despesa{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Editar Despesa</h2>
  <a href="{{ url_for('financeiro.listar_despesas') }}" class="btn btn-outline-secondary">
    <i class="fa-solid fa-arrow-left me-1"></i> Voltar
  </a>
</div>

<div class="card shadow-sm">
  <div class="card-header bg-primary text-white">
    <i class="fa-solid fa-file-invoice-dollar me-1"></i> Dados da Despesa
  </div>
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Descrição *</label>
          <input type="text" name="descricao" class="form-control" value="{{ despesa.descricao }}" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Categoria</label>
          <select name="categoria" class="form-select">
            {% for cat in categorias %}
            <option value="{{ cat }}" {% if despesa.categoria == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Valor (R$) *</label>
          <input type="number" step="0.01" min="0" name="valor" class="form-control" value="{{ despesa.valor }}" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Vencimento *</label>
          <input type="date" name="data_vencimento" class="form-control" value="{{ despesa.data_vencimento }}" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Fornecedor</label>
          <input type="text" name="fornecedor" class="form-control" value="{{ despesa.fornecedor or '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Forma de pagamento</label>
          <input type="text" name="forma_pagamento" class="form-control" value="{{ despesa.forma_pagamento or '' }}">
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="1" id="paga" name="paga" {% if despesa.status == 'pago' %}checked{% endif %}>
            <label class="form-check-label" for="paga">Já paga</label>
          </div>
        </div>

        <div class="col-md-3">
          <label class="form-label">Data do pagamento</label>
          <input type="date" name="data_pagamento" class="form-control" value="{{ despesa.data_pagamento or '' }}">
        </div>
        <div class="col-md-9">
          <label class="form-label">Observações</label>
          <input type="text" name="observacoes" class="form-control" value="{{ despesa.observacoes or '' }}">
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-success">
          <i class="fa-solid fa-save me-1"></i> Salvar Alterações
        </button>
        <a href="{{ url_for('financeiro.listar_despesas') }}" class="btn btn-secondary">
          <i class="fa-solid fa-xmark me-1"></i> Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
