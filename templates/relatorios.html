{% extends "base.html" %}
{% block title %}Relatórios{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Relatórios</h2>
</div>

<div class="row g-3">
  {% for slug, info in relatorios.items() %}
  <div class="col-md-4">
    <a href="{{ url_for('relatorios.ver_relatorio', slug=slug) }}" class="text-decoration-none">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title"><i class="fa-solid fa-chart-column me-1"></i> {{ info.titulo }}</h5>
        </div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
