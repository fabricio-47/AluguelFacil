{% extends "base.html" %}
{% block title %}Criar Conta{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">
        <i class="fa-solid fa-user-plus me-1"></i> Criar Conta Grátis
      </div>
      <div class="card-body">
        <form method="post" action="{{ url_for('auth.cadastro_publico') }}">
          <div class="mb-3">
            <label class="form-label">Nome da empresa</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-building"></i></span>
              <input type="text" name="nome_empresa" class="form-control" placeholder="Minha Locadora" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Seu usuário</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
              <input type="text" name="username" class="form-control" placeholder="seu.usuario" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="email@exemplo.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Senha</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input type="password" name="senha" class="form-control" placeholder="Mínimo 8 caracteres" minlength="8" required>
            </div>
          </div>

          <button class="btn btn-success w-100" type="submit">
            <i class="fa-solid fa-user-plus me-1"></i> Criar conta
          </button>
        </form>

        <small class="text-muted d-block mt-3">
          Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a>
        </small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
